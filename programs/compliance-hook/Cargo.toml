[package]
name = "compliance-hook"
version = "0.1.0"
description = "Token-2022 TransferHook for permissioned and freely-transferable Credit Markets pool tokens"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "compliance_hook"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.31.1"
anchor-spl = { version = "0.31.1", features = ["token", "associated_token"] }
spl-transfer-hook-interface = "0.9"
spl-tlv-account-resolution = "0.9"
