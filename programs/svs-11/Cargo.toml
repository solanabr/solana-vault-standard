[package]
name = "svs-11"
version = "2.0.0"
description = "SVS-11: Solana Vault Standard - Credit Markets Vault with KYC attestation and oracle-only NAV pricing"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "svs_11"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
modules = ["svs-module-hooks", "svs-fees", "svs-caps", "svs-locks", "svs-access", "svs-rewards"]

[dependencies]
# `init-if-needed` is required for the `claimable_tokens` ATA in
# approve_redeem. Pro-rata fulfillment may invoke approve_redeem
# multiple times for the same redemption_request; the first call
# initializes the claimable PDA, subsequent calls top it up via
# transfer_checked. Without this feature the second partial settlement
# would fail re-init.
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.31.1", features = ["token", "associated_token", "metadata"] }
spl-token-2022 = "6.0.0"
spl-transfer-hook-interface = "0.9"
svs-oracle = { path = "../../modules/svs-oracle" }
svs-fees = { path = "../../modules/svs-fees", optional = true }
svs-caps = { path = "../../modules/svs-caps", optional = true }
svs-locks = { path = "../../modules/svs-locks", optional = true }
svs-access = { path = "../../modules/svs-access", optional = true }
svs-rewards = { path = "../../modules/svs-rewards", optional = true }
svs-module-hooks = { path = "../../modules/svs-module-hooks", optional = true }

# Cross-program CPI integration. We CPI into compliance-hook's
# `initialize_extra_account_meta_list` and into mock-sas's
# `create_attestation_with_metadata` from `initialize_pool`. Both
# deps are pinned with the `cpi` feature so we get the typed Cpi accounts
# helpers without pulling in the full programs as entrypoints.
compliance-hook = { path = "../compliance-hook", features = ["cpi"] }
mock-sas = { path = "../mock-sas", features = ["cpi"] }
